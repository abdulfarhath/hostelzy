name: Play Store build

# F24 item 31: the Android App Bundle for Google Play, signed with the upload
# key from GitHub secrets (never in the repo). Run it by hand: Actions → Play
# Store build → Run workflow → production or staging. It stops with a clear
# message until the founder adds the upload key (FOUNDER-TODO 6a).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Backend: production or staging'
        required: true
        default: production
        type: choice
        options: [production, staging]

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostelzy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.HZ_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::No HZ_UPLOAD_KEYSTORE_BASE64 secret yet. See docs/FOUNDER-TODO.md step 6a."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hostelzy-upload.jks"
          echo "HZ_UPLOAD_KEYSTORE=$RUNNER_TEMP/hostelzy-upload.jks" >> "$GITHUB_ENV"
      - name: Staging backend
        if: inputs.target == 'staging'
        env:
          URL: ${{ secrets.HZ_STAGING_SUPABASE_URL }}
          KEY: ${{ secrets.HZ_STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::No staging Supabase secrets yet. See docs/FOUNDER-TODO.md step 6b."
            exit 1
          fi
          echo "HZ_DEFINES=--dart-define=HZ_ENV=staging --dart-define=SUPABASE_URL=$URL --dart-define=SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build appbundle --release --dart-define=DATA=supabase $HZ_DEFINES
        env:
          HZ_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.HZ_UPLOAD_KEYSTORE_PASSWORD }}
          HZ_UPLOAD_KEY_ALIAS: ${{ secrets.HZ_UPLOAD_KEY_ALIAS }}
          HZ_UPLOAD_KEY_PASSWORD: ${{ secrets.HZ_UPLOAD_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: hostelzy-${{ inputs.target }}-aab
          path: hostelzy/build/app/outputs/bundle/release/app-release.aab
