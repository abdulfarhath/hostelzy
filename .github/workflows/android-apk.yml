name: Android APK

on:
  push:
    branches: [main]
    # Docs-only changes (board, specs, decisions) don't need a new APK.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostelzy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk hostelzy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hostelzy-apk
          path: hostelzy/hostelzy.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Hostelzy APK build ${{ github.run_number }}
          body: Debug-signed release build for testing. Download hostelzy.apk and install it on an Android phone (allow installs from unknown sources).
          files: hostelzy/hostelzy.apk
