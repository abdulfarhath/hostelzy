name: Android APK

on:
  push:
    branches: [main]
    # Docs-only changes (board, specs, decisions) don't need a new APK.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostelzy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter test
      # F13: fixed test signing key from GitHub secrets (never in the repo),
      # so Google sign-in keeps working. Skipped when the secret isn't set.
      - name: Test signing key
        env:
          KEYSTORE_B64: ${{ secrets.HZ_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hostelzy-test.jks"
            echo "HZ_TEST_KEYSTORE=$RUNNER_TEMP/hostelzy-test.jks" >> "$GITHUB_ENV"
          else
            echo "No HZ_TEST_KEYSTORE_BASE64 secret: signing with a throwaway debug key."
          fi
      # B3: two APKs. hostelzy.apk is the real app on Supabase (honest empty
      # states, never samples); hostelzy-demo.apk runs on sample data with a
      # DEMO banner and installs next to it (".demo" id).
      - run: flutter build apk --release --dart-define=DATA=supabase
        env:
          HZ_TEST_KEYSTORE_PASSWORD: ${{ secrets.HZ_TEST_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk hostelzy.apk
      - run: flutter build apk --release --dart-define=DATA=sample
        env:
          HZ_DEMO: '1'
          HZ_TEST_KEYSTORE_PASSWORD: ${{ secrets.HZ_TEST_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk hostelzy-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hostelzy-apk
          path: |
            hostelzy/hostelzy.apk
            hostelzy/hostelzy-demo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Hostelzy APK build ${{ github.run_number }}
          body: |
            Test builds, signed with the Hostelzy test key (not the Play Store key). Allow installs from unknown sources.
            - hostelzy.apk: the real app. Live hostels from Supabase; empty until hostels are added.
            - hostelzy-demo.apk: sample data with a DEMO banner, for showing the app. Installs next to the real one ("Hostelzy Demo").
          files: |
            hostelzy/hostelzy.apk
            hostelzy/hostelzy-demo.apk
