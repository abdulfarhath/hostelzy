name: Supabase check

# Pull requests that touch supabase/: the migrations, RLS and B5 rule tests on
# a throwaway Postgres 16, and the Edge Function tests on Node.
on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-*.yml'

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test supabase/functions/tests/*.test.ts
