<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List your PG on Hostelzy, free</title>
<meta name="description" content="Hostelzy is a free app where tenants in Hyderabad find PGs and hostels. List yours in two minutes; we call you to confirm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
  /* W9 (F28 28-50): the app's look (Archivo, #ec3013, 2px rules, square corners), works at 360 px. */
  form { display: grid; gap: 14px; margin-top: 18px; }
  label { font-weight: 800; font-size: 14px; display: grid; gap: 6px; }
  label small { font-weight: 400; color: var(--mu); }
  input[type="text"], input[type="tel"], input[type="number"], select {
    height: 50px; padding: 0 12px; border: 2px solid var(--tx); background: var(--sf); color: var(--tx); font: inherit; font-size: 16px; width: 100%; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 2px solid var(--tx); }
  .seg button { font: inherit; font-weight: 700; font-size: 14px; padding: 12px 4px; background: transparent; color: var(--tx); border: 0; cursor: pointer; }
  .seg button.on { background: var(--tx); color: var(--bg); }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; }
  .photos img { width: 84px; height: 64px; object-fit: cover; border: 2px solid var(--tx); }
  .photos label.pick { width: 84px; height: 64px; border: 2px dashed var(--tx); display: grid; place-items: center; font-size: 28px; cursor: pointer; }
  .photos input { display: none; }
  button.cta { width: 100%; font: inherit; font-size: 17px; cursor: pointer; }
  button.cta[disabled] { opacity: .6; cursor: default; }
  .err { color: var(--ac); font-weight: 700; min-height: 1.4em; margin: 0; }
  .sent h1 span { color: var(--ac); }
</style>
</head>
<body>
<main>
<header><span></span><a href="../">Hostelzy</a></header>

<section id="form">
<h1>List your PG on Hostelzy. Free.</h1>

<form id="f" novalidate>
  <label>Hostel name <input type="text" name="hostel_name" maxlength="80" placeholder="Sri Balaji Men’s PG" required></label>
  <label>Your name <input type="text" name="name" maxlength="80" placeholder="Balaji" required autocomplete="name"></label>
  <label>Phone<input type="tel" name="phone" inputmode="numeric" maxlength="13" placeholder="98765 43210" required autocomplete="tel"></label>
  <label>Area <input type="text" name="area" maxlength="40" placeholder="Madhapur" required list="areas"></label>
  <datalist id="areas"></datalist>
  <label>Rent a month, from – to (₹)
    <span class="two">
      <input type="number" name="rent_min" inputmode="numeric" min="1000" max="100000" placeholder="7000" required>
      <input type="number" name="rent_max" inputmode="numeric" min="1000" max="100000" placeholder="9000" required>
    </span>
  </label>
  <label>For
    <span class="seg" data-k="gender"><button type="button" class="on" data-v="Men">Men</button><button type="button" data-v="Women">Women</button><button type="button" data-v="Co-living">Co-living</button></span>
  </label>
  <label>Food included
    <span class="seg" data-k="food"><button type="button" data-v="true">Yes</button><button type="button" class="on" data-v="false">No</button></span>
  </label>
  <label>Photos (1–3)
    <span class="photos" id="photos"><label class="pick" title="Add a photo">+<input type="file" id="pick" accept="image/*" multiple></label></span>
  </label>
  <p class="err" id="err"></p>
  <button class="cta" id="send" type="submit">Send</button>
</form>
</section>

<section id="sent" class="sent" hidden>
<h1>Thanks, <span id="who"></span>. We’ll call you within 2 days.</h1>
</section>

<footer><a href="../privacy/">Privacy</a><a href="../terms/">Terms</a><a href="https://wa.me/919059790014">WhatsApp us</a></footer>
</main>

<script type="module">
  import { supabaseUrl, supabaseAnonKey } from '../console/config.js';
  const $ = (s) => document.querySelector(s);
  const f = $('#f'), err = $('#err'), send = $('#send');
  const pick = { gender: 'Men', food: 'false' };
  for (const seg of document.querySelectorAll('.seg')) seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    pick[seg.dataset.k] = b.dataset.v;
    for (const x of seg.children) x.classList.toggle('on', x === b);
  });
  for (const a of ['Ameerpet', 'SR Nagar', 'Madhapur', 'Hitech City', 'Kondapur', 'Gachibowli', 'Nanakramguda', 'Manikonda', 'Jubilee Hills', 'Banjara Hills', 'Kukatpally', 'KPHB', 'Miyapur', 'Nizampet', 'Chanda Nagar', 'Lingampally', 'Begumpet', 'Secunderabad', 'Bowenpally', 'Alwal', 'ECIL', 'Tarnaka', 'Uppal', 'Nagole', 'LB Nagar', 'Dilsukhnagar', 'Himayatnagar', 'Narayanguda', 'Koti', 'Mehdipatnam', 'Tolichowki', 'Attapur']) {
    $('#areas').append(Object.assign(document.createElement('option'), { value: a }));
  }

  // Photos: up to 3, shrunk on the phone to ≤ 1280 px JPEG before upload.
  const photos = [];
  const shrink = (file) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? res(b) : rej(new Error('no image'))), 'image/jpeg', 0.82);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error('not an image'));
    img.src = URL.createObjectURL(file);
  });
  $('#pick').addEventListener('change', async (e) => {
    for (const file of [...e.target.files].slice(0, 3 - photos.length)) {
      try {
        const blob = await shrink(file);
        photos.push(blob);
        const img = Object.assign(document.createElement('img'), { src: URL.createObjectURL(blob), alt: 'Your photo' });
        $('#photos').insertBefore(img, $('#photos').lastElementChild);
      } catch { err.textContent = 'That file isn’t a photo.'; }
    }
    $('#photos').lastElementChild.hidden = photos.length >= 3;
    e.target.value = '';
  });

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const d = Object.fromEntries(new FormData(f));
    const phone = d.phone.replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, '');
    const min = Number(d.rent_min), max = Number(d.rent_max);
    if (d.hostel_name.trim().length < 3) return (err.textContent = 'Enter the hostel’s name.');
    if (d.name.trim().length < 2) return (err.textContent = 'Enter your name.');
    if (!/^[6-9]\d{9}$/.test(phone)) return (err.textContent = 'Enter your 10-digit mobile number.');
    if (d.area.trim().length < 2) return (err.textContent = 'Enter the area.');
    if (!(min >= 1000 && max >= min && max <= 100000)) return (err.textContent = 'Enter the rent a month, ₹1,000 to ₹1,00,000, lowest first.');
    if (!photos.length) return (err.textContent = 'Add at least one photo.');
    send.disabled = true; send.textContent = 'Sending…';
    try {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const db = createClient(supabaseUrl, supabaseAnonKey);
      const dir = `web/${crypto.randomUUID()}`;
      const paths = [];
      for (const [i, blob] of photos.entries()) {
        const path = `${dir}/${i + 1}.jpg`;
        const up = await db.storage.from('self-list').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw new Error('Couldn’t upload a photo: ' + up.error.message);
        paths.push(path);
      }
      const { error } = await db.rpc('self_list_request', { p: {
        hostel_name: d.hostel_name.trim(), name: d.name.trim(), phone, area: d.area.trim(),
        rent_min: min, rent_max: max, gender: pick.gender, food: pick.food === 'true', photos: paths,
      } });
      if (error) throw new Error(/3 requests/.test(error.message) ? '3 requests today already. We’ll call you.' : /does not exist|schema cache/.test(error.message) ? 'Not open yet.' : error.message);
      $('#who').textContent = d.name.trim().split(' ')[0];
      $('#form').hidden = true; $('#sent').hidden = false;
      window.scrollTo(0, 0);
    } catch (x) {
      err.textContent = x.message || 'Couldn’t send.';
      send.disabled = false; send.textContent = 'Send';
    }
  });
</script>
</body>
</html>
