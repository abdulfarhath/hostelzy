<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hostelzy poster · Free listing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap">
<style>
  /* W10 (F28 28-50): a printable poster for tea stalls, PG gates and Xerox shops. A4 by default, A5 with one tap. */
  :root { --bg: #f3f2f2; --tx: #201e1d; --mu: #605d5d; --ac: #ec3013; --dv: rgba(32, 30, 29, .4); }
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; background: #d9d7d7; color: var(--tx); font: 400 16px/1.4 Archivo, system-ui, sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: var(--bg); border-bottom: 2px solid var(--tx); position: sticky; top: 0; }
  .bar b { font-weight: 900; margin-right: auto; }
  .bar button { font: inherit; font-weight: 800; font-size: 14px; height: 40px; padding: 0 14px; border: 2px solid var(--tx); background: transparent; color: var(--tx); cursor: pointer; }
  .bar button.on { background: var(--tx); color: var(--bg); }
  .bar button.go { background: var(--ac); border-color: var(--ac); color: #fff; }
  .sheet { background: var(--bg); margin: 24px auto; width: 210mm; height: 297mm; padding: 16mm; display: grid; grid-template-rows: auto 1fr auto; gap: 8mm; border: 2px solid var(--tx); }
  .brand { display: flex; align-items: center; gap: 5mm; }
  .brand img { width: 18mm; height: 18mm; }
  .brand span { font-size: 11mm; font-weight: 900; letter-spacing: -.02em; }
  .mid { display: grid; grid-template-rows: auto 1fr; gap: 10mm; align-content: start; }
  h1 { font-size: 22mm; line-height: .95; font-weight: 900; letter-spacing: -.03em; color: var(--ac); margin: 0; }
  .qrbox { display: grid; grid-template-columns: auto 1fr; gap: 8mm; align-items: center; align-self: center; }
  .qr { width: 78mm; height: 78mm; border: 2px solid var(--tx); background: #fff; padding: 3mm; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; }
  .scan { font-size: 9mm; font-weight: 900; line-height: 1.1; }
  .scan small { display: block; font-size: 5.5mm; font-weight: 700; margin-top: 3mm; word-break: break-all; }
  .foot { border-top: 2px solid var(--tx); padding-top: 4mm; display: flex; justify-content: space-between; gap: 6mm; font-size: 5mm; font-weight: 700; }
  .foot span { color: var(--mu); font-weight: 400; }
  /* A5: everything scales to the smaller sheet. */
  body.a5 .sheet { width: 148mm; height: 210mm; padding: 11mm; gap: 5mm; }
  body.a5 .brand img { width: 12mm; height: 12mm; } body.a5 .brand span { font-size: 8mm; }
  body.a5 h1 { font-size: 15.5mm; }
  body.a5 .qr { width: 56mm; height: 56mm; } body.a5 .scan { font-size: 6.4mm; } body.a5 .scan small { font-size: 4mm; }
  body.a5 .foot { font-size: 3.7mm; }
  @media print {
    body { background: none; } .bar { display: none; }
    .sheet { margin: 0; border: 0; width: auto; height: auto; min-height: 0; }
  }
  @media (max-width: 820px) { .sheet { transform: scale(.45); transform-origin: top left; margin: 16px; } body { overflow-x: auto; } }
</style>
</head>
<body>
<div class="bar">
  <b>Poster · print it</b>
  <button id="a4" class="on">A4</button>
  <button id="a5">A5</button>
  <button class="go" onclick="print()">Print</button>
</div>

<div class="sheet">
  <div class="brand"><img src="mark.svg" alt=""><span>hostelzy</span></div>
  <div class="mid">
    <h1>Get tenants from Hostelzy. Free listing.</h1>
    <div class="qrbox">
      <div class="qr" id="qr"></div>
      <div class="scan">Scan to list your PG free<small id="url">farhath.me/hostelzy/app/list/</small></div>
    </div>
  </div>
  <div class="foot"><b>farhath.me/hostelzy</b></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  // The QR points at W9 (this folder's index page); the URL is printed beside it in case a phone can't scan.
  const url = location.protocol === 'https:' ? new URL('./', location.href).href : 'https://farhath.me/hostelzy/app/list/';
  document.getElementById('url').textContent = url.replace(/^https?:\/\//, '');
  try {
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch (e) {
    document.getElementById('qr').textContent = 'QR could not be drawn: type the address.';
  }
  const size = (k) => { document.body.classList.toggle('a5', k === 'a5'); a4.classList.toggle('on', k === 'a4'); a5.classList.toggle('on', k === 'a5'); page.textContent = `@page { size: ${k.toUpperCase()}; margin: 10mm; }`; };
  const page = document.head.appendChild(document.createElement('style'));
  a4.onclick = () => size('a4'); a5.onclick = () => size('a5'); size('a4');
</script>
</body>
</html>
