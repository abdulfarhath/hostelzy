<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostelzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<header><span></span><a href="../">Hostelzy</a></header>
<h1 id="t">Find this hostel on Hostelzy</h1>
<p>Hold a bed in the app to message or call the owner.</p>
<p class="mu" id="code" hidden></p>
<a class="cta" id="open" href="hostelzy://app/r">Open in Hostelzy</a>
<a class="cta ghost" href="https://github.com/abdulfarhath/hostelzy/releases/latest">Get the app (Android test build)</a>
<script>
  // W2 (F28 Part 2): r/?h=<id>&claim=1 is the claim link a resident sends their owner:
  // the app opens the hostel's page with "Claim this hostel".
  const q = new URLSearchParams(location.search);
  const h = q.get('h') || '';
  if (/^[0-9a-f-]{36}$/i.test(h)) {
    document.getElementById('t').textContent = 'Your PG is on Hostelzy';
    document.querySelector('main > p').textContent = 'A resident added your hostel as unverified. Agree to get it verified, free: open it in the app and tap “Claim this hostel”. The Hostelzy team calls you to check.';
    const o = document.getElementById('open');
    o.href = 'hostelzy://app/r?h=' + encodeURIComponent(h) + (q.get('claim') ? '&claim=1' : '');
    setTimeout(() => { location.href = o.href; }, 400);
  }
  // Old enquiry links (r/?c=HZ-…) still open the app; the code is shown only for reference.
  const c = (q.get('c') || '').toUpperCase();
  if (/^HZ-[0-9]{3,8}$/.test(c)) {
    const el = document.getElementById('code');
    el.textContent = 'Code ' + c;
    el.hidden = false;
    document.getElementById('open').href = 'hostelzy://app/r?c=' + encodeURIComponent(c);
  }
</script>
<footer><a href="../privacy/">Privacy</a><a href="../terms/">Terms</a><a href="../delete-account/">Delete account</a><a href="https://wa.me/919059790014">WhatsApp us</a></footer>
</main>
</body>
</html>
