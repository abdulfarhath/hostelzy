<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team console: layout help, draw the walls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 1440px; height: 900px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<header style="flex: none; height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 2px solid var(--tx);"><span style="font-weight: 800; font-size: 20px;">hostelzy <b style="color: var(--ac); font-weight: 800;">team</b></span><span style="flex: 1;"></span><span style="font-size: 13px; color: var(--mu);">farhath@hostelzy.in · Team</span><button style="height: 38px; padding: 0 16px; font-weight: 800; font-size: 13px; border: 2px solid var(--tx);">Sign out</button></header><div style="flex-grow: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0;"><aside style="border-right: 2px solid var(--tx); padding-top: 12px;"><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Onboarding</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Payments</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Fair Play</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--tx); background: var(--sf); box-shadow: inset 4px 0 0 var(--ac);">Layout help</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Rewards</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Layout fixes</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Reported reviews</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Hostels</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Listed</a><a href="#" style="height: 48px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--mu);">Claims</a></aside><main style="min-width: 0; padding: 20px 24px; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 24px; align-content: start;"><div style="display: grid; gap: 14px; align-content: start;"><h2 style="margin: 0; font-size: 24px; font-weight: 800;">Anjani Residency · Room 105</h2><b style="font-size: 13px;">Shape</b><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid var(--tx);"><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">Rectangle</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: var(--tx); color: var(--bg);">L shape</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">T shape</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">U shape</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">Angled corner</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">Narrow end</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">Alcove</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; ">Custom</button></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;"><label style="display: grid; gap: 6px; font-size: 13px; font-weight: 800;">Width (ft)<input value="14" style="height: 44px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px;"></label><label style="display: grid; gap: 6px; font-size: 13px; font-weight: 800;">Length (ft)<input value="12" style="height: 44px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px;"></label></div><div style="display: flex; gap: 8px;"><button style="height: 40px; padding: 0 14px; font-weight: 800; background: var(--ac); color: var(--ai);">Send to owner ✓</button><button style="height: 40px; padding: 0 14px; font-weight: 800; border: 2px solid var(--tx);">Back to the request</button></div><span style="font-size: 13px; color: var(--mu); line-height: 1.45;">The owner’s app places the beds, fans and windows inside these walls; they check it and publish.</span></div><div style="height: 420px; border: 2px solid var(--tx); position: relative; background-color: var(--bg); background-image: repeating-linear-gradient(0deg, var(--hl) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, var(--hl) 0 1px, transparent 1px 24px);"><div style="position: absolute; left: 48px; top: 48px; width: 336px; height: 288px; border: 4px solid var(--tx); clip-path: polygon(0 0, 100% 0, 100% 66%, 70% 66%, 70% 100%, 0 100%);"></div><span style="position: absolute; right: 8px; bottom: 6px; font-size: 12px; color: var(--mu);">1 square = 1 ft</span></div></main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
