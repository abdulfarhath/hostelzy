<!doctype html>
<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="height: 200px; flex: none; position: relative; border-bottom: 2px solid var(--tx); background: repeating-linear-gradient(135deg, var(--sf) 0 8px, var(--bg) 8px 16px);"><button aria-label="Back" style="position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m15 18-6-6 6-6"/></svg></button><div style="position: absolute; left: 14px; bottom: 10px; font-size: 11px; color: var(--mu);">photo 1 / 9</div></div><div style="padding: 14px 16px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--ad);">Men · Madhapur</span><b style="display: block; font-size: 30px; line-height: 1.02; letter-spacing: -.025em;">Anjani Residency</b></div><div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(20,18,17,.55);"><div style="flex-grow: 1; min-height: 40px;"></div><div style="background: var(--bg); border-top: 2px solid var(--tx); padding-bottom: 24px;"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--dv);"><span style="display: grid; gap: 2px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Anjani Residency</span><span style="font-weight: 800; font-size: 20px;">Ask Srinivas</span></span><button aria-label="Close" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div style="padding: 14px 16px; display: grid; gap: 10px;"><div style="padding: 12px; background: var(--sf); font-size: 15px; line-height: 1.5;">Hi Srinivas, I found Anjani Residency on Hostelzy. Is bed 204-D free? Can I see it today? Booking code HZ-4830</div><button style="width: 100%; height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; background: var(--ac); color: var(--ai);">Open WhatsApp<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></button><span style="font-size: 13px; color: var(--mu);">The booking code keeps your Hostelzy price. Nothing is sent until you press send in WhatsApp.</span></div></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
