<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team members</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: none; padding: 12px 16px 14px; display: flex; gap: 12px; align-items: flex-start;"><button aria-label="Back" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m15 18-6-6 6-6"/></svg></button><div style="flex-grow: 1; min-width: 0;"><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Hostelzy team</div><div style="font-weight: 800; font-size: 28px; line-height: 1.02; letter-spacing: -.025em; margin-top: 4px;">Team members</div></div></div><div style="border-top: 2px solid var(--tx);"></div><div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;"><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--hl);"><span style="display: grid; gap: 2px; min-width: 0;"><b style="font-size: 15px;">Founder</b><span style="font-size: 12px; color: var(--mu); line-height: 1.35;">90000 00100 · Everything</span></span><span style="flex: none; padding: 3px 7px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; background: var(--tx); color: var(--bg); border: 1px solid var(--tx);">Active</span></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--hl);"><span style="display: grid; gap: 2px; min-width: 0;"><b style="font-size: 15px;">Priya</b><span style="font-size: 12px; color: var(--mu); line-height: 1.35;">90000 00102 · Visits</span></span><span style="flex: none; padding: 3px 7px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; background: var(--ab); color: var(--ad); border: 1px solid var(--ab);">Invite pending</span></div><div style="padding: 18px 16px; display: grid; gap: 12px;"><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Add a team member</div><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Name</b><input value="" placeholder="Name" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">WhatsApp number</b><input value="" placeholder="10-digit number" inputmode="numeric" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border: 2px solid var(--tx);"><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: var(--tx); color: var(--bg);">Visits</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--tx);">Layouts</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--tx);">Payments</button></div><button style="width: 100%; height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; background: var(--ac); color: var(--ai);">Send invite<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/></svg></button><span style="font-size: 12px; color: var(--mu); line-height: 1.45;">Visits: add hostels and residents. Layouts: draw rooms. Payments: check UTRs. Real team accounts come with the backend (F13).</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
