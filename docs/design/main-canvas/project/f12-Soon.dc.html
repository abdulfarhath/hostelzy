<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tenant: layout coming soon and locked states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px;">
    <button aria-label="Back" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="m15 18-6-6 6-6"/></svg></button>
    <div><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">{{hostel}}</div><div style="font-weight: 800; font-size: 22px; line-height: 1.1;">Pick a bed</div></div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0 16px; border: 2px solid var(--tx);">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: {{t.bg}}; color: {{t.fg}};">{{t.label}}</button></sc-for>
  </div>
  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-weight: 800; font-size: 20px;">{{room}}</span><span style="font-size: 13px; font-weight: 600;">{{roomLine}}</span></div>
    <div style="height: 300px; border: 2px dashed var(--dv); display: grid; place-items: center; padding: 24px; text-align: center;">
      <div style="display: grid; gap: 8px; justify-items: center;">
        <span style="width: 52px; height: 52px; display: grid; place-items: center; background: var(--sf);">
          <sc-if value="{{lock}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 11h14v10H5z"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></sc-if>
          <sc-if value="{{pencil}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 21h4L20 8l-4-4L3 17z"/><path d="m14 6 4 4"/></svg></sc-if>
        </span>
        <b style="font-size: 20px;">{{head}}</b>
        <span style="font-size: 14px; color: var(--mu); line-height: 1.45; max-width: 280px;">{{body}}</span>
      </div>
    </div>
    <sc-if value="{{showBtn}}" hint-placeholder-val="{{true}}">
      <button style="height: 50px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 15px;">{{btn}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </sc-if>
    <span style="font-size: 12px; color: var(--mu); line-height: 1.4;">{{foot}}</span>
  </div>
  <div style="flex: none; border-top: 2px solid var(--tx); padding: 12px 16px;">
    <button style="width: 100%; height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; background: var(--ac); color: var(--ai); font-weight: 800; font-size: 15px;">{{cta}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["Layout coming soon","Women’s PG: floor plan before hold","Signed out"],"default":"Layout coming soon"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'Layout coming soon';
    const tab = active => ['Plan', 'Room', 'List', 'Building'].map(l => ({ label: l, bg: l === active ? 'var(--tx)' : 'transparent', fg: l === active ? 'var(--bg)' : 'var(--tx)' }));
    const V = {
      'Layout coming soon': {
        hostel: 'Greenview Men’s PG', tabs: tab('Room'), room: 'Room 102', roomLine: '3 sharing · Non-AC · ₹6,400/mo', lock: false,
        head: 'Layout coming soon', body: 'The Hostelzy team is drawing this room. You can still pick a bed from Plan or List, and see the photos.',
        showBtn: true, btn: 'Tell me when it’s ready', foot: 'Layouts are drawn by Hostelzy after a visit, so what you see matches the room.', cta: 'Hold bed 102-B · ₹6,400'
      },
      'Women’s PG: floor plan before hold': {
        hostel: 'Sai Sri Ladies Hostel', tabs: tab('Plan'), room: 'Floor 2', roomLine: '8 free beds', lock: true,
        head: 'Floor plan shows after you hold a bed', body: 'For residents’ safety, the full floor plan of a women’s PG opens only after a hold. Each room’s own layout is in the Room tab.',
        showBtn: true, btn: 'See rooms in the Room tab', foot: 'Hostelzy never shows gates, CCTV, exits or residents’ names on any plan.', cta: 'Hold a bed free for 1 hour'
      },
      'Signed out': {
        hostel: 'Sai Sri Ladies Hostel', tabs: tab('Room'), room: 'Room 203', roomLine: '2 sharing · AC', lock: true,
        head: 'Sign in to see room layouts', body: 'Room layouts are only for people who have verified their phone number.',
        showBtn: false, btn: '', foot: 'Sign in once with Google. We never share your number with the hostel until you choose to.', cta: 'Verify my phone'
      }
    }[st];
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light', ...V, pencil: !V.lock };
  }
}
</script>
</body>
</html>
