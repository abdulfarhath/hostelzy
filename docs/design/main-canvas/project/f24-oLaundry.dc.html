<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laundry day: pick a day, residents get a reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: none; padding: 12px 16px 12px; display: flex; gap: 12px; align-items: flex-start;"><button aria-label="Back" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m15 18-6-6 6-6"/></svg></button><div style="flex-grow: 1; display: grid; gap: 2px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Anjani Residency · Manage</span><b style="display: block; font-size: 30px; line-height: 1.02; letter-spacing: -.025em;">House rules</b></div></div><div style="flex-grow: 1; overflow: hidden; padding: 0 16px; display: grid; gap: 12px; align-content: start;"><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Gate closes</b><input value="10:30 pm" placeholder="" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Visitors</b><input value="Common area, till 8 pm" placeholder="" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Notice period</b><input value="30 days" placeholder="" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Advance</b><input value="₹3,000 · ₹1,000 kept on leaving" placeholder="" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Anything else</b><input value="No cooking in rooms" placeholder="" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label><span style="font-size: 13px; color: var(--mu);">Tenants see these under House rules › on your hostel page.</span></div><div style="flex: none; border-top: 2px solid var(--tx); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;"><button style="width: 100%; height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; background: var(--ac); color: var(--ai);">Save rules<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M20 6 9 17l-5-5"/></svg></button></div><div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(20,18,17,.55);"><div style="flex-grow: 1; min-height: 40px;"></div><div style="background: var(--bg); border-top: 2px solid var(--tx); padding-bottom: 24px;"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--dv);"><span style="display: grid; gap: 2px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">House rules</span><span style="font-weight: 800; font-size: 20px;">Laundry day</span></span><button aria-label="Close" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div style="padding: 14px 16px; display: grid; gap: 10px;"><b style="font-size: 13px;">Laundry day</b><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;"><button style="height: 40px; font-size: 13px; font-weight: 800; border: 1px solid var(--dv);">Mon</button><button style="height: 40px; font-size: 13px; font-weight: 800; border: 1px solid var(--dv);">Tue</button><button style="height: 40px; font-size: 13px; font-weight: 800; border: 1px solid var(--dv);">Wed</button><button style="height: 40px; font-size: 13px; font-weight: 800; border: 1px solid var(--dv);">Thu</button><button style="height: 40px; font-size: 13px; font-weight: 800; border: 1px solid var(--dv);">Fri</button><button style="height: 40px; font-size: 13px; font-weight: 800; border: 1px solid var(--dv);">Sat</button><button style="height: 40px; font-size: 13px; font-weight: 800; background: var(--tx); color: var(--bg);">Sun</button></div><b style="font-size: 13px;">Machine free</b><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border: 2px solid var(--tx);"><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: var(--tx); color: var(--bg);">7 am – 12 pm</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--tx);">All day</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--tx);">Evening</button></div><span style="font-size: 13px; color: var(--mu); line-height: 1.45;">Residents who turn on the Laundry reminder get it at 8 pm the evening before.</span><button style="width: 100%; height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; background: var(--ac); color: var(--ai);">Save laundry day<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M20 6 9 17l-5-5"/></svg></button></div></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
