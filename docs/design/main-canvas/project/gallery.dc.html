<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: none; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #161514; color: #f0eeee;"><button aria-label="Close" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #ffffff55; color: #f0eeee;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M18 6 6 18M6 6l12 12"/></svg></button><b style="font-size: 15px;">3 / 14 · Room, 3 sharing</b><span style="width: 44px;"></span></div><div style="flex-grow: 1; background: #161514; display: grid; place-items: center;"><div style="width: 390px; height: 292px; background: repeating-linear-gradient(135deg, #24221f 0 10px, #2e2b28 10px 20px); display: flex; align-items: flex-end; padding: 10px; color: #bab6b6; font-size: 11px;">photo</div></div><div style="flex: none; background: var(--bg); padding: 12px 0 16px; display: grid; gap: 10px;"><div style="display: flex; gap: 6px; padding: 0 16px; overflow: hidden;"><button style="flex: none; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--dv); background: transparent; color: var(--tx);">All 14</button><button style="flex: none; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--dv); background: transparent; color: var(--tx);">Rooms 6</button><button style="flex: none; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--tx); background: var(--tx); color: var(--bg);">Washroom 2</button><button style="flex: none; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--dv); background: transparent; color: var(--tx);">Food 2</button><button style="flex: none; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--dv); background: transparent; color: var(--tx);">Common 3</button><button style="flex: none; height: 36px; padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--dv); background: transparent; color: var(--tx);">Front 1</button></div><div style="display: flex; gap: 6px; padding: 0 16px; overflow: hidden;"><span style="flex: none; width: 64px; height: 48px; border: 1px solid var(--hl); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span><span style="flex: none; width: 64px; height: 48px; border: 1px solid var(--hl); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span><span style="flex: none; width: 64px; height: 48px; border: 2px solid var(--ac); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span><span style="flex: none; width: 64px; height: 48px; border: 1px solid var(--hl); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span><span style="flex: none; width: 64px; height: 48px; border: 1px solid var(--hl); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span><span style="flex: none; width: 64px; height: 48px; border: 1px solid var(--hl); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span><span style="flex: none; width: 64px; height: 48px; border: 1px solid var(--hl); background: repeating-linear-gradient(135deg, var(--sf) 0 5px, var(--bg) 5px 10px);"></span></div><div style="padding: 0 16px; font-size: 12px; color: var(--mu);">Photos by the owner</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
