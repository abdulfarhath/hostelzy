<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role: three rows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: none; padding: 12px 16px 12px; display: flex; gap: 12px; align-items: flex-start;"><div style="flex-grow: 1; display: grid; gap: 2px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Welcome, Ravi</span><b style="display: block; font-size: 30px; line-height: 1.02; letter-spacing: -.025em;">What brings you here?</b></div></div><div style="flex-grow: 1; border-top: 2px solid var(--tx);"><button style="width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) 20px; gap: 14px; align-items: center; padding: 18px 16px; border-bottom: 1px solid var(--hl); text-align: left;"><span style="width: 48px; height: 48px; display: grid; place-items: center; background: var(--sf);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><span style="display: grid; gap: 2px;"><b style="font-size: 19px;">I need a bed</b><span style="font-size: 14px; color: var(--mu);">Find and hold a bed in a PG</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m9 18 6-6-6-6"/></svg></button><button style="width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) 20px; gap: 14px; align-items: center; padding: 18px 16px; border-bottom: 1px solid var(--hl); text-align: left;"><span style="width: 48px; height: 48px; display: grid; place-items: center; background: var(--sf);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M15 21v-8H9v8"/><path d="M3 10 12 3l9 7v11H3z"/></svg></span><span style="display: grid; gap: 2px;"><b style="font-size: 19px;">I live in a PG</b><span style="font-size: 14px; color: var(--mu);">Rent, food and complaints</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m9 18 6-6-6-6"/></svg></button><button style="width: 100%; display: grid; grid-template-columns: 48px minmax(0, 1fr) 20px; gap: 14px; align-items: center; padding: 18px 16px; border-bottom: 1px solid var(--hl); text-align: left;"><span style="width: 48px; height: 48px; display: grid; place-items: center; background: var(--sf);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M3 19V6M3 14h18v5M21 14a3 3 0 0 0-3-3h-7v3"/></svg></span><span style="display: grid; gap: 2px;"><b style="font-size: 19px;">I run a PG</b><span style="font-size: 14px; color: var(--mu);">Beds, residents and rent</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m9 18 6-6-6-6"/></svg></button></div><div style="padding: 16px; font-size: 13px; color: var(--mu);">You can switch later in Me.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
