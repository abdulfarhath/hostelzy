<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team console: not set up yet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 1440px; height: 900px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex-grow: 1; display: grid; place-items: center; background: var(--sf);"><div style="width: 440px; padding: 40px; background: var(--bg); border: 2px solid var(--tx); display: grid; gap: 18px;"><span style="font-weight: 800; font-size: 28px;">hostelzy <b style="color: var(--ac); font-weight: 800;">team</b></span><h1 style="font-size: 30px; margin: 0; font-weight: 900; letter-spacing: -.02em;">Team console</h1><p style="margin: 0; color: var(--mu); font-size: 14px; line-height: 1.5;">Not set up yet. The founder adds the Firebase web app config (docs/FOUNDER-TODO.md), then this page works.</p><span style="flex: none; padding: 3px 7px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; background: var(--ab); color: var(--ad); border: 1px solid var(--ab);">Founder step</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
