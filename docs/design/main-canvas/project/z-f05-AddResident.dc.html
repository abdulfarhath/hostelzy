<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner: add a resident</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1;">
    <div style="padding: 12px 16px 14px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Anjani Residency</div>
      <div style="font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.025em; margin-top: 4px;">Manage</div>
    </div>
  </div>
  <nav aria-label="Owner tabs" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 64px; border-top: 2px solid var(--tx); background: var(--bg);">
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu); box-shadow: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></svg>Today</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 19V6M3 14h18v5M21 14a3 3 0 0 0-3-3h-7v3"/></svg>Beds</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--ai); background: var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Booking</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 7h18v12H3z"/><path d="M16 13h2"/><path d="M5 7l11-3v3"/></svg>Rent</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--tx); box-shadow: inset 0 3px 0 var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 13h5l1 3h6l1-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Manage</button>
  </nav>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(20,18,17,.55);">
    <a href="z-f05-Residents.dc.html" aria-label="Close" style="flex-grow: 1; min-height: 40px;"></a>
    <div style="background: var(--bg); border-top: 2px solid var(--tx); padding-bottom: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--dv);">
        <span style="font-weight: 800; font-size: 20px;">Add a resident</span>
        <a href="z-f05-Residents.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--dv); color: var(--tx);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
      </div>
      <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px;">
        <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Name</b><input value="Ravi Teja" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label>
        <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">WhatsApp number</b><input value="98490 33121" inputmode="numeric" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label>
        <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--sf); border-left: 0; font-size: 13px; line-height: 1.4;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none; margin-top: 1px;"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/></svg>
          <span><b>{{m.head}}</b> {{m.body}}</span>
        </div>
        <div style="display: grid; gap: 6px;"><b style="font-size: 13px;">Bed</b>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <button style="padding: 8px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--ac); background: var(--ab); color: var(--ad);">204-A · no resident</button>
            <button style="padding: 8px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--ac); background: transparent; color: var(--ad);">301-C · no resident</button>
            <button style="padding: 8px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--dv);">103-A</button>
            <button style="padding: 8px 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--dv);">201-C</button>
          </div>
        </div>
        <div style="display: grid; gap: 6px;"><b style="font-size: 13px;">Joined on</b>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--tx);">
            <button style="padding: 10px; font-size: 13px; font-weight: 600; text-align: center; background: var(--tx); color: var(--bg);">Today</button>
            <button style="padding: 10px; font-size: 13px; font-weight: 600; text-align: center;">Yesterday</button>
            <button style="padding: 10px; font-size: 13px; font-weight: 600; text-align: center;">Pick date</button>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Monthly fee</b><input value="₹7,000" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label>
          <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Advance paid</b><input value="₹3,000" style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label>
        </div>
        <div style="font-size: 12px; color: var(--mu); line-height: 1.4;">Ravi gets a WhatsApp code to confirm. They count as a resident once they confirm.</div>
        <a href="z-f05-Confirm.dc.html" style="display: flex; justify-content: space-between; align-items: center; height: 54px; padding: 0 16px; background: var(--ac); color: var(--ai); font-weight: 800; font-size: 15px; text-decoration: none;">Add and send code<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 6 9 17l-5-5"/></svg></a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"match":{"editor":"enum","options":["Via Hostelzy","Direct"],"default":"Via Hostelzy"},"window":{"editor":"enum","options":["30 days","60 days"],"default":"30 days"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.window ?? '30 days';
    const hz = (this.props.match ?? 'Via Hostelzy') === 'Via Hostelzy';
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      m: hz
        ? { head: 'Joined via Hostelzy.', body: 'This number asked about your hostel on Hostelzy today (HZ-4821).' }
        : { head: 'Direct.', body: 'No Hostelzy enquiry, hold or booking from this number in the last ' + w + '.' }
    };
  }
}
</script>
</body>
</html>
