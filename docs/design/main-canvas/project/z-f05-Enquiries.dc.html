<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner: Today with Enquiries from Hostelzy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; overflow: hidden;">
    <div style="padding: 12px 16px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <div>
        <div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Anjani Residency · Thu 1 Oct</div>
        <div style="font-weight: 800; font-size: 32px; line-height: 1.02; letter-spacing: -.025em; margin-top: 4px;">Today</div>
      </div>
      <button aria-label="Me" style="width: 44px; height: 44px; background: var(--ac); color: var(--ai); display: grid; place-items: center; font-weight: 800; font-size: 14px;">SR</button>
    </div>
    <div style="padding: 14px 16px; border-top: 2px solid var(--tx); border-bottom: 2px solid var(--tx);">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;"><span style="font-weight: 800; font-size: 56px; line-height: .9; letter-spacing: -.04em;">84%</span><span style="font-size: 13px; color: var(--mu); text-align: right; padding-bottom: 4px;">27 of 32 beds taken</span></div>
      <div style="display: flex; height: 14px; margin-top: 12px; border: 2px solid var(--tx);"><span style="width: 78%; background: var(--tx);"></span><span style="width: 6%; background: repeating-linear-gradient(135deg, var(--tx) 0 2px, transparent 2px 5px);"></span><span style="width: 6%; background: var(--ab);"></span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--hl); border-bottom: 2px solid var(--dv);">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <button style="background: var(--bg); padding: 12px 16px; display: grid; gap: 2px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">{{k.label}}</span><span style="font-weight: 800; font-size: 26px; letter-spacing: -.02em; color: {{k.fg}};">{{k.v}}</span><span style="font-size: 12px; color: var(--mu);">{{k.sub}}</span></button>
      </sc-for>
    </div>

    <div style="padding: 18px 16px 6px; display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Enquiries from Hostelzy</span>
      <span style="font-size: 12px; font-weight: 800; color: var(--ad);">{{newLine}}</span>
    </div>
    <div style="border-top: 2px solid var(--dv);">
      <sc-for list="{{rows}}" as="e" hint-placeholder-count="3">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--hl); display: grid; gap: 8px;">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start;">
            <span style="display: grid; gap: 2px;">
              <span style="font-weight: 800; font-size: 16px;">{{e.name}}</span>
              <span style="display: flex; gap: 5px; align-items: center; font-size: 13px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M20 6 9 17l-5-5"/></svg>{{e.phone}}<span style="color: var(--mu);">· verified</span></span>
              <span style="font-size: 13px; color: var(--mu);">{{e.bed}} · <a href="z-f05-EnquiryDetail.dc.html" style="font-weight: 600;">{{e.ref}}</a></span>
            </span>
            <span style="display: grid; gap: 4px; justify-items: end;">
              <span style="padding: 3px 7px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: {{e.tagBg}}; color: {{e.tagFg}}; border: 1px solid {{e.tagBd}};">{{e.tag}}</span>
              <span style="font-size: 12px; color: var(--mu);">{{e.ago}}</span>
            </span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <button onClick="{{e.contact}}" style="height: 44px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; background: {{e.waBg}}; color: {{e.waFg}}; border: 2px solid {{e.waBd}}; font-weight: 800; font-size: 14px;">WhatsApp<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></button>
            <button onClick="{{e.contact}}" style="height: 44px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 14px;">Call<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
          </div>
        </div>
      </sc-for>
      <div style="padding: 12px 16px; display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--mu); line-height: 1.4;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none; margin-top: 1px;"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/></svg>
        <span><b style="color: var(--tx);">Not on this list = not from Hostelzy.</b> Someone says they found you on Hostelzy? Ask for their HZ code.</span>
      </div>
    </div>
  </div>
  <nav aria-label="Owner tabs" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 64px; border-top: 2px solid var(--tx); background: var(--bg);">
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--tx); box-shadow: inset 0 3px 0 var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></svg>Today</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 19V6M3 14h18v5M21 14a3 3 0 0 0-3-3h-7v3"/></svg>Beds</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--ai); background: var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Booking</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 7h18v12H3z"/><path d="M16 13h2"/><path d="M5 7l11-3v3"/></svg>Rent</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu); box-shadow: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 13h5l1 3h6l1-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Manage</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"tile":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { done: { 'HZ-4809': true } };
  renderVals() {
    const E = [
      { ref: 'HZ-4821', name: 'Ravi Teja', phone: '98490 33121', bed: 'Bed 204-A', ago: '6 min ago' },
      { ref: 'HZ-4817', name: 'Sandeep Kumar', phone: '99891 20456', bed: 'Bed 201-C', ago: '18 min ago' },
      { ref: 'HZ-4809', name: 'Imran Shaikh', phone: '97012 45580', bed: 'Any bed', ago: '2 h ago' }
    ];
    const done = this.state.done;
    const fresh = E.filter(e => !done[e.ref]).length;
    const k4 = (this.props.tile ?? false)
      ? { label: 'Enquiries', v: String(fresh), sub: 'New from Hostelzy', fg: fresh ? 'var(--ad)' : 'var(--tx)' }
      : { label: 'Complaints', v: '3', sub: 'Open or in progress', fg: 'var(--tx)' };
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      kpis: [
        { label: 'Free beds', v: '5', sub: '2 freeing up soon', fg: 'var(--tx)' },
        { label: 'Hold requests', v: '2', sub: 'Need your reply', fg: 'var(--ad)' },
        { label: 'Rent pending', v: '₹41,200', sub: '2 overdue', fg: 'var(--tx)' },
        k4
      ],
      newLine: fresh ? fresh + ' new' : 'All replied',
      rows: E.map(e => {
        const d = !!done[e.ref];
        return {
          ...e,
          tag: d ? 'Contacted' : 'New',
          tagBg: d ? 'transparent' : 'var(--ab)',
          tagFg: d ? 'var(--mu)' : 'var(--ad)',
          tagBd: d ? 'var(--dv)' : 'var(--ab)',
          waBg: d ? 'transparent' : 'var(--ac)',
          waFg: d ? 'var(--tx)' : 'var(--ai)',
          waBd: d ? 'var(--tx)' : 'var(--ac)',
          contact: () => this.setState({ done: { ...this.state.done, [e.ref]: true } })
        };
      })
    };
  }
}
</script>
</body>
</html>
