<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner: one enquiry</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}

[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--ai); background: var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Booking</button>

      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--hl); font-size: 14px;"><span style="color: var(--mu);">{{r.k}}</span><span style="font-weight: 600;">{{r.v}}</span></div>

      <div style="margin: 14px 16px 0; padding: 12px; background: var(--sf); display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.4;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none; margin-top: 1px;"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7" r="3.5"/><path d="M19 8v6M16 11h6"/></svg>
        <span>If Ravi joins, add them in <b>Manage → Residents</b> with this number. They'll show as <b>Joined via Hostelzy</b>.</span>
      </div>
      <div style="padding: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button style="height: 50px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; background: var(--ac); color: var(--ai); font-weight: 800; font-size: 15px;">WhatsApp<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></button>
        <button style="height: 50px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 15px;">Call<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
      </div>
      <div style="padding: 10px 16px 0;"><button style="height: 44px; font-weight: 800; font-size: 14px; text-decoration: underline;">Mark as contacted</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      rows: [
        { k: 'Phone', v: '98490 33121 · verified by OTP' },
        { k: 'Asked about', v: 'Bed 204-A · 3 sharing' },
        { k: 'When', v: 'Today, 6:42 pm' },
        { k: 'From', v: 'Hostel page · Ask on WhatsApp' },
        { k: 'Message', v: '“Can I come and see the rooms this evening?”' },
        { k: 'Status', v: 'New · not replied yet' }
      ]

  }
}
</script>
</body>
