<!doctype html>
<html lang="en">
<head>

<title>Login without demo buttons</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<sc-if value="{{v0}}" hint-placeholder-val="{{true}}"><div style="display: contents;"><div style="flex-grow: 1; padding: 12px 20px 28px; display: flex; flex-direction: column;"><button aria-label="Back" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m15 18-6-6 6-6"/></svg></button><div style="margin-top: 28px;"><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Step 1 of 2</div></div><div style="font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -.025em; margin-top: 6px;">Your mobile number</div><div style="font-size: 15px; color: var(--mu); margin-top: 10px;">We send a 6-digit code by SMS. No passwords.</div><label style="display: grid; grid-template-columns: 72px minmax(0, 1fr); border: 2px solid var(--tx); margin-top: 28px; height: 60px;"><span style="display: flex; align-items: center; padding: 0 14px; font-weight: 800; font-size: 20px; border-right: 2px solid var(--tx);">+91</span><input aria-label="Mobile number" value="" placeholder="10-digit number" inputmode="numeric" style="border: 0; background: transparent; padding: 0 14px; font-weight: 800; font-size: 22px; width: 100%;"></label><div style="flex-grow: 1;"></div><button style="width: 100%; height: 56px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; text-decoration: none; background: var(--tk); color: var(--mu);">Send code<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button><div style="margin-top: 12px; font-size: 13px; color: var(--mu); text-align: center;">By continuing you agree to the <b style="color: var(--tx);">Terms</b> and <b style="color: var(--tx);">Privacy policy</b>.</div></div></div></sc-if><sc-if value="{{v1}}" hint-placeholder-val="{{false}}"><div style="display: contents;"><div style="flex-grow: 1; padding: 12px 20px 28px; display: flex; flex-direction: column;"><button aria-label="Back" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m15 18-6-6 6-6"/></svg></button><div style="margin-top: 28px;"><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Step 2 of 2</div></div><div style="font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -.025em; margin-top: 6px;">Enter the code</div><div style="font-size: 15px; color: var(--mu); margin-top: 10px;">Sent by SMS to +91 90000 00001. Android can fill it in for you.</div><div style="margin-top: 28px;"><div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;"><span style="height: 52px; display: grid; place-items: center; border: 2px solid var(--ac); font-weight: 800; font-size: 22px;"></span><span style="height: 52px; display: grid; place-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 22px;"></span><span style="height: 52px; display: grid; place-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 22px;"></span><span style="height: 52px; display: grid; place-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 22px;"></span><span style="height: 52px; display: grid; place-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 22px;"></span><span style="height: 52px; display: grid; place-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 22px;"></span></div></div><div style="margin-top: 12px; display: flex; justify-content: space-between; font-size: 13px;"><span style="color: var(--mu);">Resend in 0:24</span><button style="font-weight: 800; color: var(--mu);">Change number</button></div><div style="flex-grow: 1;"></div><button style="width: 100%; height: 56px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; text-decoration: none; background: var(--tk); color: var(--mu);">Verify<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "step": {"editor": "enum", "options": ["Phone number", "Code"], "default": "Phone number"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    const v = this.props.step ?? "Phone number";
    out.v0 = v === "Phone number";
    out.v1 = v === "Code";
    return out;
  }
}
</script>
</body>
</html>
