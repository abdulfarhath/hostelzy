<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner: crop a photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: none; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;"><button style="height: 44px; font-weight: 800; font-size: 15px;">Cancel</button><b style="font-size: 17px;">Crop photo</b><button style="height: 44px; font-weight: 800; font-size: 15px; color: var(--ad);">Use</button></div><div style="flex-grow: 1; position: relative; background: #161514; display: grid; place-items: center;"><div style="position: relative; width: 358px; height: 268px; background: repeating-linear-gradient(135deg, #24221f 0 10px, #2e2b28 10px 20px);"><span style="position: absolute; inset: 0; border: 2px solid #f3f2f2; background-image: linear-gradient(#f3f2f266 1px, transparent 1px), linear-gradient(90deg, #f3f2f266 1px, transparent 1px); background-size: 33.33% 33.33%;"></span><span style="position: absolute; left: -6px; top: -6px; width: 16px; height: 16px; background: #f3f2f2;"></span><span style="position: absolute; right: -6px; top: -6px; width: 16px; height: 16px; background: #f3f2f2;"></span><span style="position: absolute; left: -6px; bottom: -6px; width: 16px; height: 16px; background: #f3f2f2;"></span><span style="position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px; background: #f3f2f2;"></span><span style="position: absolute; left: 10px; bottom: 10px; color: #f3f2f2; font-size: 11px;">photo · room 204</span></div></div><div style="flex: none; padding: 12px 16px 16px; display: grid; gap: 10px;"><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border: 2px solid var(--tx);"><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: var(--tx); color: var(--bg);">4:3 listing</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--tx);">Square</button><button style="padding: 10px 4px; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--tx);">Free</button></div><div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600;">Set as cover photo<span style="width: 44px; height: 24px; flex: none; border: 2px solid var(--tx); display: flex; justify-content: flex-start; padding: 2px; background: transparent;"><span style="width: 16px; height: 16px; background: var(--tx);"></span></span></div><div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600;">Room type<span style="font-size: 14px; color: var(--mu);">3 sharing · AC ▾</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
