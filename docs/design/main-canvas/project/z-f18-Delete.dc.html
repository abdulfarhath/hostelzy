<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delete account v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<sc-if value="{{v0}}" hint-placeholder-val="{{true}}"><div style="display: contents;"><div style="flex: none; padding: 12px 16px 14px; display: flex; gap: 12px; align-items: flex-start;"><button aria-label="Back" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="m15 18-6-6 6-6"/></svg></button><div style="flex-grow: 1; min-width: 0;"><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Delete account</div><div style="font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.025em; margin-top: 4px;">Confirm it’s you</div></div></div><div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;"><div style="padding: 0 16px; display: grid; gap: 14px;"><div style="font-size: 15px; color: var(--mu); line-height: 1.5;">Sign in with Google once more to delete your Hostelzy account. This can’t be undone.</div><div style="padding: 12px; border: 2px solid var(--tx); display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center;"><span style="width: 40px; height: 40px; display: grid; place-items: center; background: var(--ac); color: var(--ai); font-weight: 800;">RT</span><span style="display: grid; gap: 1px;"><b style="font-size: 15px;">Ravi Teja</b><span style="font-size: 12px; color: var(--mu);">ravi.teja@gmail.com</span></span></div><button style="width: 100%; height: 54px; padding: 0 16px; display: flex; gap: 12px; align-items: center; justify-content: center; background: #ffffff; color: #201e1d; border: 2px solid #201e1d; font-weight: 800; font-size: 16px;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 16px;">G</span>Confirm with Google</button></div></div><div style="flex: none; border-top: 2px solid var(--tx); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;"><button style="width: 100%; height: 50px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; border: 2px solid var(--tx); color: var(--tx);">Keep my account</button></div></div></sc-if><sc-if value="{{v1}}" hint-placeholder-val="{{false}}"><div style="display: contents;"><div style="flex-grow: 1; padding: 80px 24px 24px; display: flex; flex-direction: column; gap: 14px;"><span style="width: 56px; height: 56px; display: grid; place-items: center; background: var(--tx); color: var(--bg);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" style="flex: none;"><path d="M20 6 9 17l-5-5"/></svg></span><div style="font-weight: 800; font-size: 34px; line-height: 1.02; letter-spacing: -.025em;">Your account is deleted</div><div style="font-size: 15px; color: var(--mu); line-height: 1.5;">We removed your name, phone, Google sign-in, holds, saved hostels and rewards. Reviews stay as “Former resident”.</div><div style="flex-grow: 1;"></div><button style="width: 100%; height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; background: var(--tx); color: var(--bg);">Close Hostelzy</button></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "step": {"editor": "enum", "options": ["Confirm with Google", "Deleted"], "default": "Confirm with Google"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    const v = this.props.step ?? "Confirm with Google";
    out.v0 = v === "Confirm with Google";
    out.v1 = v === "Deleted";
    return out;
  }
}
</script>
</body>
</html>
