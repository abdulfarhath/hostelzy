<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard-safe: UTR sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex-grow: 1; display: flex; flex-direction: column; background: rgba(20,18,17,.55); min-height: 0;"><div style="flex-grow: 1; min-height: 16px;"></div><div style="background: var(--bg); border-top: 2px solid var(--tx);"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 2px solid var(--dv);"><span style="display: grid; gap: 1px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Advance ₹3,000 to Srinivas</span><b style="font-size: 18px;">Enter the UTR</b></span><button aria-label="Close" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--dv);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div style="padding: 12px 16px; display: grid; gap: 10px;"><label style="display: grid; gap: 6px;"><b style="font-size: 13px;">12-digit UTR</b><input value="4021 8834 12" inputmode="numeric" style="height: 50px; padding: 0 12px; border: 2px solid var(--ac); background: var(--bg); font-size: 18px; font-weight: 800; width: 100%;"></label><button style="width: 100%; height: 50px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none; background: var(--ac); color: var(--ai);">Send to Srinivas<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="flex: none;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button></div></div></div><div aria-label="Phone keyboard" style="flex: none; padding: 8px 6px 12px; background: #24221f; display: grid; gap: 6px;"><span style="font-size: 10px; color: #bab6b6; text-align: center; padding-bottom: 2px;">phone keyboard</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;"><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">1</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">2</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">3</span></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;"><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">4</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">5</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">6</span></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;"><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">7</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">8</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">9</span></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;"><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">⌫</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">0</span><span style="height: 48px; display: grid; place-items: center; background: #3a3634; color: #f0eeee; font-size: 18px; font-weight: 600;">✓</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark": {"editor": "boolean", "default": false}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const out = { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
    return out;
  }
}
</script>
</body>
</html>
