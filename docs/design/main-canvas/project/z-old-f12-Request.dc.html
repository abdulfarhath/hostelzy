<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owner: request a layout change</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; padding: 12px 16px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Anjani Residency · Beds</div>
    <div style="font-weight: 800; font-size: 26px; line-height: 1.02; letter-spacing: -.025em; margin-top: 4px;">Room 204 layout</div>
  </div>
  <nav aria-label="Owner tabs" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 64px; border-top: 2px solid var(--tx); background: var(--bg);">
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu); box-shadow: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></svg>Today</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--tx); box-shadow: inset 0 3px 0 var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 19V6M3 14h18v5M21 14a3 3 0 0 0-3-3h-7v3"/></svg>Beds</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--ai); background: var(--ac);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Booking</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 7h18v12H3z"/><path d="M16 13h2"/><path d="M5 7l11-3v3"/></svg>Rent</button>
    <button style="display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 5px; padding: 0 12px; font-size: 11px; font-weight: 600; color: var(--mu); box-shadow: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 13h5l1 3h6l1-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Manage</button>
  </nav>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(20,18,17,.55);">
    <a href="#" aria-label="Close" style="flex-grow: 1; min-height: 40px;"></a>
    <div style="background: var(--bg); border-top: 2px solid var(--tx); padding-bottom: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--dv);">
        <span style="display: grid; gap: 2px;"><span style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mu);">Room 204</span><span style="font-weight: 800; font-size: 20px;">Request a change</span></span>
        <a href="#" aria-label="Close" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--dv); color: var(--tx);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
      </div>
      <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px;">
        <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">What's different?</b><input value="Bed C is against the washroom wall, not near the door." style="height: 46px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 14px; width: 100%;"></label>
        <div style="display: grid; gap: 6px;"><b style="font-size: 13px;">Add any of these</b>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
              <button onClick="{{t.add}}" style="min-height: 76px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; border: {{t.bd}}; background: {{t.bg}};">
                <span style="display: flex; justify-content: space-between; align-items: center; width: 100%;"><b style="font-size: 14px;">{{t.label}}</b><span style="font-size: 11px; font-weight: 800; color: {{t.stFg}};">{{t.st}}</span></span>
                <span style="font-size: 12px; color: var(--mu); line-height: 1.3;">{{t.sub}}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Length (ft)</b><input value="18" inputmode="numeric" style="height: 44px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label>
          <label style="display: grid; gap: 6px;"><b style="font-size: 13px;">Width (ft)</b><input value="15" inputmode="numeric" style="height: 44px; padding: 0 12px; border: 2px solid var(--tx); background: var(--bg); font-size: 15px; width: 100%;"></label>
        </div>
        <div style="font-size: 12px; color: var(--mu); line-height: 1.4;">Free. The Hostelzy team redraws it within 48 hours and sends you the new version to approve. Tenants keep seeing the current layout until then.</div>
        <button style="height: 54px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; background: var(--ac); color: var(--ai); font-weight: 800; font-size: 15px;">Send request<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { got: { photo: true, voice: true } };
  renderVals() {
    const g = this.state.got;
    const T = [
      { id: 'photo', label: 'Room photo', sub: 'From the door, whole room' },
      { id: 'sketch', label: 'Paper sketch', sub: 'Draw it on paper, take a photo' },
      { id: 'voice', label: 'Voice note', sub: 'Say what’s wrong, any language' },
      { id: 'more', label: 'More photos', sub: 'Pillar, alcove, balcony' }
    ];
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      tiles: T.map(t => {
        const on = !!g[t.id];
        return {
          label: t.label, sub: on ? (t.id === 'voice' ? 'Added · 0:18' : 'Added · 1 photo') : t.sub,
          st: on ? 'Added' : '+ Add', stFg: on ? 'var(--tx)' : 'var(--ad)',
          bd: on ? '2px solid var(--tx)' : '1px dashed var(--dv)', bg: on ? 'var(--sf)' : 'transparent',
          add: () => this.setState({ got: { ...g, [t.id]: !on } })
        };
      })
    };
  }
}
</script>
</body>
</html>
