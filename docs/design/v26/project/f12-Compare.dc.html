<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>[S19] compare · Compare two beds · Updated (F31)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ae1800}a:hover{color:#ec3013}
[data-hz]{--bg:#f3f2f2;--sf:#eae9e9;--tx:#201e1d;--mu:#605d5d;--ac:#ec3013;--ai:#f8f4f4;--ab:#ffe0d9;--ad:#ae1800;--dv:rgba(32,30,29,.4);--hl:rgba(32,30,29,.16);--tk:#bab6b6;--gn:#1f7a3d;--gb:#dcefe0;line-height:1.4}
[data-hz][data-theme="dark"]{--bg:#161514;--sf:#24221f;--tx:#f0eeee;--mu:#bab6b6;--ac:#ff563c;--ai:#161514;--ab:#4d170e;--ad:#ff9783;--dv:rgba(240,238,238,.36);--hl:rgba(240,238,238,.14);--tk:#4a4646;--gn:#5fcf86;--gb:#133a22}
[data-hz] *{box-sizing:border-box}
[data-hz] a{color:var(--ad)}
[data-hz] button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
[data-hz] input{font:inherit;color:inherit;outline:none}
[data-hz] :focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</helmet>
<div data-hz="" data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--tx); font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px;">
    <a href="f12-Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--dv); color: var(--tx);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="m15 18-6-6 6-6"/></svg></a>
    <div><div style="font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; color: var(--mu);">Room 204 · 3 sharing · AC</div><div style="font-weight: 800; font-size: 22px; line-height: 1.1;">Compare beds</div></div>
  </div>
  <div style="padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px;">
        <div aria-label="Room 204 layout, 18 by 15 feet" style="position: relative; width: 358px; height: 300px; border: 2px solid var(--tx); overflow: hidden; background-color: var(--bg); background-image: repeating-linear-gradient(0deg, var(--hl) 0 1px, transparent 1px 20px), repeating-linear-gradient(90deg, var(--hl) 0 1px, transparent 1px 20px);">
          <div style="position: absolute; left: 0; bottom: 0; width: 100px; height: 80px; border-top: 2px solid var(--tx); border-right: 2px solid var(--tx); background: repeating-linear-gradient(135deg, var(--tk) 0 2px, var(--bg) 2px 7px);"><span style="position: absolute; left: 6px; bottom: 6px; padding: 1px 4px; background: var(--bg); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">Washroom</span></div>
          <div style="position: absolute; top: 0; left: 150px; width: 150px;"><div style="height: 6px; background: var(--tx);"></div><span style="display: inline-block; margin-top: 3px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">Window · street</span></div>
          <div style="position: absolute; bottom: 0; right: 30px; width: 60px; height: 4px; background: var(--bg);"></div>
          <span style="position: absolute; bottom: 8px; right: 42px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mu);">Door</span>
          <div>
            <div style="position: absolute; top: 0; right: 10px; width: 150px; height: 120px; display: {{m.ac}}; clip-path: polygon(100% 22%, 100% 52%, 0 100%, 0 0); background: repeating-linear-gradient(90deg, var(--dv) 0 1px, transparent 1px 6px);"></div>
            <div style="position: absolute; top: 26px; right: 0; width: 10px; height: 36px; background: {{m.acFg}};"></div>
            <span style="position: absolute; top: 66px; right: 14px; padding: 1px 4px; background: var(--bg); font-size: 10px; font-weight: 800; letter-spacing: .08em; color: {{m.acFg}};">AC UNIT</span>
          </div>
          <sc-for list="{{m.fans}}" as="f" hint-placeholder-count="2">
            <div style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: 160px; height: 160px; border: 1.5px dashed var(--dv); border-radius: 50%; display: {{m.fan}};"></div>
            <span style="position: absolute; left: {{f.ix}}px; top: {{f.iy}}px; display: flex; gap: 3px; align-items: center; padding: 1px 4px; background: var(--bg); font-size: 10px; font-weight: 800; letter-spacing: .08em; color: {{f.fg}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="12" r="2"/><path d="M12 10V3M14 13l6 3.5M10 13l-6 3.5"/></svg>{{f.label}}</span>
          </sc-for>
          <sc-for list="{{m.beds}}" as="b" hint-placeholder-count="3">
            <button onClick="{{b.pick}}" aria-label="Bed {{b.letter}}, {{b.tag}}" style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; width: 54px; height: 108px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; background: {{b.bg}}; border: {{b.bd}}; color: {{b.fg}};">
              <span style="font-weight: 800; font-size: 22px; line-height: 1;">{{b.letter}}</span>
              <span style="font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;">{{b.tag}}</span>
            </button>
          </sc-for>
        </div>
    <div style="font-size: 12px; color: var(--mu);">Both ₹8,200 a month</div>
  </div>
  <div style="flex-grow: 1; overflow: hidden; border-top: 2px solid var(--tx);">
    <div style="display: grid; grid-template-columns: 96px repeat(2, minmax(0, 1fr)); border-bottom: 2px solid var(--tx);">
      <span></span>
      <span style="padding: 10px; font-weight: 800; font-size: 17px; background: var(--ac); color: var(--ai);">Bed {{a}}</span>
      <span style="padding: 10px; font-weight: 800; font-size: 17px; background: var(--ab); color: var(--ad); border-left: 1px solid var(--hl);">Bed {{b}}</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 96px repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--hl); font-size: 13px;">
        <span style="padding: 9px 10px 9px 16px; color: var(--mu);">{{r.k}}</span>
        <span style="padding: 9px 10px; font-weight: {{r.wa}};">{{r.a}}</span>
        <span style="padding: 9px 10px; font-weight: {{r.wb}}; border-left: 1px solid var(--hl);">{{r.b}}</span>
      </div>
    </sc-for>
  </div>
  <div style="flex: none; border-top: 2px solid var(--tx); padding: 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <button style="height: 54px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; background: var(--ac); color: var(--ai); font-weight: 800; font-size: 15px;">Hold {{a}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button style="height: 54px; padding: 0 14px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--tx); font-weight: 800; font-size: 15px;">Hold {{b}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pair: ['B', 'C'] };
  renderVals() {
    const ST = {
      free: { bg: 'var(--bg)', bd: '2px solid var(--tx)', fg: 'var(--tx)', tag: 'Free' },
      held: { bg: 'repeating-linear-gradient(135deg, var(--tk) 0 2px, var(--bg) 2px 6px)', bd: '2px solid var(--tk)', fg: 'var(--mu)', tag: 'On hold' },
      booked: { bg: 'var(--tk)', bd: '2px solid var(--tk)', fg: 'var(--tx)', tag: 'Taken' },
      sel: { bg: 'var(--ac)', bd: '2px solid var(--ac)', fg: 'var(--ai)', tag: 'Selected' },
      cmp: { bg: 'var(--ab)', bd: '2px solid var(--ac)', fg: 'var(--ad)', tag: 'Compare' },
      plain: { bg: 'var(--sf)', bd: '2px solid var(--tx)', fg: 'var(--tx)', tag: '3 × 6 ft' }
    };
    const POS = { A: [16, 16], B: [180, 16], C: [282, 170] };
    const mkMap = (o) => {
      const L = o.layers || {};
      const vis = k => (L[k] === false ? 'none' : 'block');
      return {
        wash: vis('wash'), win: vis('win'), ac: vis('ac'), fan: vis('fan'),
        acFg: o.acBad ? 'var(--ad)' : 'var(--tx)',
        fans: [{ x: 127, y: 60, ix: 180, iy: 131, label: o.fan1Bad ? 'FAN · NOT WORKING' : 'FAN', fg: o.fan1Bad ? 'var(--ad)' : 'var(--tx)' }, { x: 220, y: 135, ix: 240, iy: 140, label: o.fan2Bad ? 'FAN · NOT WORKING' : 'FAN', fg: o.fan2Bad ? 'var(--ad)' : 'var(--tx)' }],
        beds: ['A', 'B', 'C'].map(k => ({ letter: k, x: POS[k][0], y: POS[k][1], ...ST[o.state(k)], pick: o.pick ? o.pick(k) : () => {} }))
      };
    };
    const D = {
      B: { fan: 'Under a fan', ac: 'In the airflow', win: 'Window side · street', door: '4 m', wash: '4 m', wall: 'One wall' },
      C: { fan: 'Under a fan', ac: 'Out of the airflow', win: 'No window', door: 'Near the door', wash: '3 m', wall: 'Corner' }
    };
    const [a, b] = this.state.pair;
    const K = [['fan', 'Fan'], ['ac', 'AC'], ['win', 'Window'], ['door', 'Door'], ['wash', 'Washroom'], ['wall', 'Walls']];
    return {
      theme: (this.props.dark ?? false) ? 'dark' : 'light',
      a, b,
      m: mkMap({ state: k => k === 'A' ? 'booked' : k === a ? 'sel' : 'cmp' }),
      rows: K.map(([k, label]) => ({ k: label, a: D[a][k], b: D[b][k], wa: D[a][k] === D[b][k] ? 400 : 600, wb: D[a][k] === D[b][k] ? 400 : 600 })).concat([{ k: 'Price', a: '₹8,200/mo', b: '₹8,200/mo', wa: 800, wb: 800 }])
    };
  }
}
</script>
</body>
</html>
